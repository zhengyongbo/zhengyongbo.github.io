<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>认识时间</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "微软雅黑", Arial, sans-serif;
      }

      /* 小朋友友好的活泼背景 */
      body {
        background-color: #fff5f8;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 10px 20px;
        touch-action: manipulation;
        transition: padding-bottom 0.3s ease;
      }

      /* 标题样式 */
      .title {
        font-size: 44px;
        color: #ff6b9d;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
        text-align: center;
      }

      /* 主内容区域 — 键盘弹出时可滚动上移 */
      .main-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        transition: transform 0.3s ease;
      }

      /* 钟表容器 */
      .clock-container {
        position: relative;
        margin-bottom: 20px;
      }

      #clockCanvas {
        border: 8px solid #ffd166;
        border-radius: 50%;
        background-color: white;
        box-shadow: 0 0 25px rgba(255, 209, 102, 0.6);
        max-width: 100%;
        height: auto;
      }

      /* 时间输入区域 */
      .input-area {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
      }

      .time-input {
        width: 100px;
        height: 60px;
        border: 4px solid #4ecdc4;
        border-radius: 15px;
        font-size: 28px;
        text-align: center;
        outline: none;
        color: #333;
        background-color: #f0fcfb;
        caret-color: transparent;
      }

      .time-input.active-input {
        border-color: #ff6b9d;
        background-color: #fff0f5;
        box-shadow: 0 0 8px rgba(255, 107, 157, 0.4);
      }

      .time-text {
        font-size: 28px;
        color: #ff6b9d;
        font-weight: bold;
      }

      /* 按钮区域 */
      .btn-area {
        display: flex;
        gap: 30px;
        margin-bottom: 20px;
      }

      .game-btn {
        width: 140px;
        height: 60px;
        border: none;
        border-radius: 20px;
        font-size: 26px;
        font-weight: bold;
        color: white;
        cursor: pointer;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        transition: transform 0.2s;
      }

      .game-btn:active {
        transform: scale(0.95);
      }

      #startBtn {
        background-color: #2ed573;
      }

      #submitBtn {
        background-color: #1e90ff;
      }

      /* 虚拟数字键盘 */
      #numberKeyboard {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background-color: #ffd166;
        padding: 10px 15px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        display: none;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        z-index: 100;
      }

      .key-btn {
        height: 56px;
        border: none;
        border-radius: 12px;
        font-size: 28px;
        font-weight: bold;
        background-color: white;
        color: #ff6b9d;
        box-shadow: 0 3px 5px rgba(0, 0, 0, 0.1);
        -webkit-tap-highlight-color: transparent;
      }

      .key-btn:active {
        background-color: #f0f0f0;
      }

      /* 结果模态框 */
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 200;
      }

      .modal-content {
        width: 85%;
        max-width: 400px;
        background-color: white;
        border-radius: 25px;
        padding: 40px 20px;
        text-align: center;
        position: relative;
      }

      #fireworksCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 25px;
        pointer-events: none;
      }

      .modal-text {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 10px;
        z-index: 10;
        position: relative;
      }

      .correct-text {
        color: #2ed573;
      }

      .wrong-text {
        color: #ff3838;
      }

      /* 正确答案提示 */
      .correct-answer {
        font-size: 24px;
        color: #1e90ff;
        font-weight: bold;
        margin-bottom: 15px;
        z-index: 10;
        position: relative;
        display: none;
      }

      /* 查看答案小按钮 */
      .show-answer-btn {
        display: none;
        margin: 0 auto 15px;
        padding: 8px 20px;
        border: 2px solid #1e90ff;
        border-radius: 12px;
        font-size: 16px;
        font-weight: bold;
        color: #1e90ff;
        background-color: #e8f4ff;
        cursor: pointer;
        z-index: 10;
        position: relative;
      }

      .show-answer-btn:active {
        background-color: #d0e8ff;
      }

      .close-btn {
        width: 120px;
        height: 50px;
        border: none;
        border-radius: 15px;
        font-size: 24px;
        font-weight: bold;
        color: white;
        background-color: #ff6b9d;
        cursor: pointer;
        z-index: 10;
        position: relative;
      }

      /* 手机端适配 */
      @media (max-width: 480px) {
        .title {
          font-size: 32px;
          margin-bottom: 6px;
        }

        #clockCanvas {
          width: 280px;
          height: 280px;
        }

        .clock-container {
          margin-bottom: 15px;
        }

        .time-input {
          width: 80px;
          height: 50px;
          font-size: 24px;
        }

        .time-text {
          font-size: 24px;
        }

        .input-area {
          gap: 10px;
          margin-bottom: 15px;
        }

        .game-btn {
          width: 120px;
          height: 50px;
          font-size: 22px;
        }

        .btn-area {
          gap: 20px;
          margin-bottom: 15px;
        }

        .key-btn {
          height: 50px;
          font-size: 24px;
        }

        .modal-text {
          font-size: 26px;
        }

        .correct-answer {
          font-size: 20px;
        }
      }

      @media (max-width: 360px) {
        .title {
          font-size: 28px;
        }

        #clockCanvas {
          width: 240px;
          height: 240px;
        }
      }
    </style>
  </head>
  <body>
    <!-- 顶部标题 -->
    <h1 class="title">认识时间</h1>

    <!-- 主内容区域 -->
    <div class="main-content" id="mainContent">
      <!-- 钟表绘图区 -->
      <div class="clock-container">
        <canvas id="clockCanvas" width="350" height="350"></canvas>
      </div>

      <!-- 时间输入区 -->
      <div class="input-area" id="inputArea">
        <input
          type="text"
          class="time-input"
          id="hourInput"
          placeholder="时"
          maxlength="2"
          readonly
          inputmode="none"
        />
        <span class="time-text">时</span>
        <input
          type="text"
          class="time-input"
          id="minuteInput"
          placeholder="分"
          maxlength="2"
          readonly
          inputmode="none"
        />
        <span class="time-text">分</span>
      </div>

      <!-- 按钮区域 -->
      <div class="btn-area">
        <button class="game-btn" id="startBtn">开始</button>
        <button class="game-btn" id="submitBtn">提交</button>
      </div>
    </div>

    <!-- 虚拟数字键盘 -->
    <div id="numberKeyboard">
      <button class="key-btn">1</button>
      <button class="key-btn">2</button>
      <button class="key-btn">3</button>
      <button class="key-btn">4</button>
      <button class="key-btn">5</button>
      <button class="key-btn">6</button>
      <button class="key-btn">7</button>
      <button class="key-btn">8</button>
      <button class="key-btn">9</button>
      <button class="key-btn">0</button>
      <button class="key-btn" id="delBtn">删除</button>
      <button class="key-btn" id="confirmBtn">确认</button>
    </div>

    <!-- 结果模态框 -->
    <div class="modal" id="resultModal">
      <div class="modal-content">
        <canvas id="fireworksCanvas"></canvas>
        <div class="modal-text" id="modalText"></div>
        <button class="show-answer-btn" id="showAnswerBtn">查看正确答案</button>
        <div class="correct-answer" id="correctAnswer"></div>
        <button class="close-btn" id="closeModalBtn">确定</button>
      </div>
    </div>

    <script>
      // 获取DOM元素
      const clockCanvas = document.getElementById("clockCanvas");
      const clockCtx = clockCanvas.getContext("2d");
      const hourInput = document.getElementById("hourInput");
      const minuteInput = document.getElementById("minuteInput");
      const startBtn = document.getElementById("startBtn");
      const submitBtn = document.getElementById("submitBtn");
      const numberKeyboard = document.getElementById("numberKeyboard");
      const resultModal = document.getElementById("resultModal");
      const modalText = document.getElementById("modalText");
      const correctAnswer = document.getElementById("correctAnswer");
      const closeModalBtn = document.getElementById("closeModalBtn");
      const showAnswerBtn = document.getElementById("showAnswerBtn");
      const fireworksCanvas = document.getElementById("fireworksCanvas");
      const fireworksCtx = fireworksCanvas.getContext("2d");
      const delBtn = document.getElementById("delBtn");
      const confirmBtn = document.getElementById("confirmBtn");
      const mainContent = document.getElementById("mainContent");

      // 全局变量
      let correctHour = 0;
      let correctMinute = 0;
      let currentInput = null;
      let isGameStarted = false;

      // 页面初始化
      window.onload = function () {
        drawInitialTip();
        resizeCanvas();
      };

      // 画布适配
      function resizeCanvas() {
        fireworksCanvas.width =
          document.querySelector(".modal-content").offsetWidth;
        fireworksCanvas.height =
          document.querySelector(".modal-content").offsetHeight;
      }

      // 初始提示文字
      function drawInitialTip() {
        clockCtx.clearRect(0, 0, 350, 350);
        clockCtx.fillStyle = "#ff6b9d";
        clockCtx.font = "bold 24px 微软雅黑";
        clockCtx.textAlign = "center";
        clockCtx.textBaseline = "middle";
        clockCtx.fillText("小朋友，点击下方[开始]按钮", 175, 165);
        clockCtx.fillText("开始挑战吧!", 175, 205);
      }

      // 随机生成非整时、非半时时间
      function randomTime() {
        correctHour = Math.floor(Math.random() * 12) + 1;
        do {
          correctMinute = Math.floor(Math.random() * 60);
        } while (correctMinute === 0 || correctMinute === 30);
        drawClock(correctHour, correctMinute);
      }

      // 【核心升级】绘制专业钟表：1-12数字+60分钟小格+时针分针
      function drawClock(hour, minute) {
        const centerX = 175;
        const centerY = 175;
        const radius = 150;

        clockCtx.clearRect(0, 0, 350, 350);

        // 1. 画表盘底色
        clockCtx.beginPath();
        clockCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        clockCtx.fillStyle = "white";
        clockCtx.fill();
        clockCtx.strokeStyle = "#ffd166";
        clockCtx.lineWidth = 8;
        clockCtx.stroke();

        // 2. 画60个分钟小刻度
        clockCtx.strokeStyle = "#cccccc";
        clockCtx.lineWidth = 2;
        for (let i = 0; i < 60; i++) {
          const angle = (i * Math.PI) / 30;
          clockCtx.beginPath();
          clockCtx.moveTo(
            centerX + Math.cos(angle) * (radius - 8),
            centerY + Math.sin(angle) * (radius - 8),
          );
          clockCtx.lineTo(
            centerX + Math.cos(angle) * radius,
            centerY + Math.sin(angle) * radius,
          );
          clockCtx.stroke();
        }

        // 3. 画12个小时大刻度
        clockCtx.strokeStyle = "#4ecdc4";
        clockCtx.lineWidth = 5;
        for (let i = 0; i < 12; i++) {
          const angle = (i * Math.PI) / 6;
          clockCtx.beginPath();
          clockCtx.moveTo(
            centerX + Math.cos(angle) * (radius - 15),
            centerY + Math.sin(angle) * (radius - 15),
          );
          clockCtx.lineTo(
            centerX + Math.cos(angle) * radius,
            centerY + Math.sin(angle) * radius,
          );
          clockCtx.stroke();
        }

        // 4. 绘制内部1-12数字
        clockCtx.fillStyle = "#333";
        clockCtx.font = "bold 28px 微软雅黑";
        clockCtx.textAlign = "center";
        clockCtx.textBaseline = "middle";
        for (let i = 1; i <= 12; i++) {
          const angle = (i * Math.PI) / 6 - Math.PI / 2;
          const x = centerX + Math.cos(angle) * (radius - 35);
          const y = centerY + Math.sin(angle) * (radius - 35);
          clockCtx.fillText(i.toString(), x, y);
        }

        // 5. 计算指针角度
        const minuteAngle = (minute * Math.PI) / 30 - Math.PI / 2;
        const hourAngle =
          ((hour % 12) * Math.PI) / 6 -
          Math.PI / 2 +
          (minute * Math.PI) / 360;

        // 6. 画分针（长指针）
        clockCtx.strokeStyle = "#1e90ff";
        clockCtx.lineWidth = 6;
        clockCtx.beginPath();
        clockCtx.moveTo(centerX, centerY);
        clockCtx.lineTo(
          centerX + Math.cos(minuteAngle) * (radius - 40),
          centerY + Math.sin(minuteAngle) * (radius - 40),
        );
        clockCtx.stroke();

        // 7. 画时针（短指针）
        clockCtx.strokeStyle = "#ff6b9d";
        clockCtx.lineWidth = 8;
        clockCtx.beginPath();
        clockCtx.moveTo(centerX, centerY);
        clockCtx.lineTo(
          centerX + Math.cos(hourAngle) * (radius - 70),
          centerY + Math.sin(hourAngle) * (radius - 70),
        );
        clockCtx.stroke();

        // 8. 画中心圆点
        clockCtx.beginPath();
        clockCtx.arc(centerX, centerY, 10, 0, Math.PI * 2);
        clockCtx.fillStyle = "#ffd166";
        clockCtx.fill();
      }

      // 显示虚拟键盘并按需上移内容
      function showKeyboard(inputEl) {
        currentInput = inputEl;
        // 高亮当前输入框
        hourInput.classList.remove("active-input");
        minuteInput.classList.remove("active-input");
        inputEl.classList.add("active-input");
        // 显示键盘
        numberKeyboard.style.display = "grid";
        // 动态计算：输入区底部是否被键盘遮挡
        const inputArea = document.getElementById("inputArea");
        const inputBottom = inputArea.getBoundingClientRect().bottom;
        const keyboardTop = numberKeyboard.getBoundingClientRect().top;
        const gap = 15; // 留一点间距
        const overlap = inputBottom - keyboardTop + gap;
        if (overlap > 0) {
          mainContent.style.transform = "translateY(-" + overlap + "px)";
        } else {
          mainContent.style.transform = "";
        }
      }

      // 隐藏虚拟键盘并恢复内容位置
      function hideKeyboard() {
        numberKeyboard.style.display = "none";
        mainContent.style.transform = "";
        hourInput.classList.remove("active-input");
        minuteInput.classList.remove("active-input");
        currentInput = null;
      }

      // 阻止输入框获焦时弹出系统软键盘
      function preventNativeKeyboard(e) {
        e.preventDefault();
        e.target.blur();
      }

      hourInput.addEventListener("focus", preventNativeKeyboard);
      minuteInput.addEventListener("focus", preventNativeKeyboard);

      // 点击输入框打开虚拟键盘
      hourInput.addEventListener("click", () => {
        if (!isGameStarted) return;
        showKeyboard(hourInput);
      });

      minuteInput.addEventListener("click", () => {
        if (!isGameStarted) return;
        showKeyboard(minuteInput);
      });

      // 数字按键 — 输满2位自动跳转下一个输入框
      document.querySelectorAll(".key-btn").forEach((btn) => {
        if (btn !== delBtn && btn !== confirmBtn) {
          btn.addEventListener("click", () => {
            if (currentInput && currentInput.value.length < 2) {
              currentInput.value += btn.textContent;
              // 小时：输入大于1的数字直接跳分钟（因为最大12，首位>1不可能有第二位）
              // 或者已满2位也跳
              if (
                currentInput === hourInput &&
                (hourInput.value.length === 2 ||
                  (hourInput.value.length === 1 && parseInt(hourInput.value) > 1))
              ) {
                showKeyboard(minuteInput);
              } else if (currentInput === minuteInput && minuteInput.value.length === 2) {
                // 分钟输满2位，自动提交判断
                hideKeyboard();
                submitBtn.click();
              }
            }
          });
        }
      });

      // 删除键 — 当前输入框为空时自动回退到上一个输入框
      delBtn.addEventListener("click", () => {
        if (!currentInput) return;
        if (currentInput.value.length > 0) {
          currentInput.value = currentInput.value.slice(0, -1);
        } else if (currentInput === minuteInput) {
          // 分钟框为空，回退到小时框删除
          showKeyboard(hourInput);
          hourInput.value = hourInput.value.slice(0, -1);
        }
      });

      // 确认隐藏键盘
      confirmBtn.addEventListener("click", () => {
        hideKeyboard();
      });

      // 点击页面空白区域关闭键盘
      document.addEventListener("click", (e) => {
        if (
          numberKeyboard.style.display === "grid" &&
          !numberKeyboard.contains(e.target) &&
          e.target !== hourInput &&
          e.target !== minuteInput &&
          e.target !== startBtn
        ) {
          hideKeyboard();
        }
      });

      // 开始按钮 — 自动弹出小时输入键盘
      startBtn.addEventListener("click", () => {
        isGameStarted = true;
        hourInput.value = "";
        minuteInput.value = "";
        randomTime();
        showKeyboard(hourInput);
      });

      // 提交按钮
      submitBtn.addEventListener("click", () => {
        if (!isGameStarted) {
          alert("请先点击[开始]按钮开始挑战！");
          return;
        }

        hideKeyboard();

        const userHour = parseInt(hourInput.value) || 0;
        const userMinute = parseInt(minuteInput.value) || 0;

        // 格式化正确答案
        const correctH = correctHour.toString();
        const correctM = correctMinute.toString().padStart(2, "0");

        if (userHour === correctHour && userMinute === correctMinute) {
          // 答对
          modalText.className = "modal-text correct-text";
          modalText.textContent = "恭喜你，答对了!";
          correctAnswer.style.display = "none";
          showAnswerBtn.style.display = "none";
          resultModal.style.display = "flex";
          drawFireworks();
          // 自动下一题
          setTimeout(() => {
            resultModal.style.display = "none";
            hourInput.value = "";
            minuteInput.value = "";
            randomTime();
          }, 2000);
        } else {
          // 答错 — 显示查看答案按钮，隐藏答案文字
          modalText.className = "modal-text wrong-text";
          modalText.textContent = "很遗憾，再想一想吧!";
          correctAnswer.textContent =
            "正确答案：" + correctH + " 时 " + correctM + " 分";
          correctAnswer.style.display = "none";
          showAnswerBtn.style.display = "block";
          resultModal.style.display = "flex";
          hourInput.value = "";
          minuteInput.value = "";
        }
      });

      // 关闭模态框
      closeModalBtn.addEventListener("click", () => {
        resultModal.style.display = "none";
        correctAnswer.style.display = "none";
        correctAnswer.textContent = "";
        showAnswerBtn.style.display = "none";
      });

      // 查看正确答案按钮
      showAnswerBtn.addEventListener("click", () => {
        showAnswerBtn.style.display = "none";
        correctAnswer.style.display = "block";
      });

      // 礼花动画
      function drawFireworks() {
        fireworksCtx.clearRect(
          0,
          0,
          fireworksCanvas.width,
          fireworksCanvas.height,
        );
        let particles = [];
        const colors = ["#ff6b9d", "#4ecdc4", "#ffd166", "#2ed573", "#1e90ff"];

        for (let i = 0; i < 120; i++) {
          particles.push({
            x: fireworksCanvas.width / 2,
            y: fireworksCanvas.height / 2,
            size: Math.random() * 5 + 2,
            color: colors[Math.floor(Math.random() * colors.length)],
            speed: Math.random() * 6 + 3,
            angle: Math.random() * Math.PI * 2,
          });
        }

        function animate() {
          fireworksCtx.clearRect(
            0,
            0,
            fireworksCanvas.width,
            fireworksCanvas.height,
          );
          particles.forEach((p) => {
            p.x += Math.cos(p.angle) * p.speed;
            p.y += Math.sin(p.angle) * p.speed;
            p.size *= 0.96;

            fireworksCtx.beginPath();
            fireworksCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            fireworksCtx.fillStyle = p.color;
            fireworksCtx.fill();
          });

          if (particles[0].size > 0.1) requestAnimationFrame(animate);
        }
        animate();
      }
    </script>
  </body>
</html>
